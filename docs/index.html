<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>공유가계부</title>
  <meta name="description" content="지은과 홍균의 수입·지출 공유 가계부">
  <meta name="theme-color" content="#F3F1EB" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#151412" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="가계부">
  <meta name="format-detection" content="telephone=no">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div id="login" hidden></div>

  <div id="app" hidden>
    <header class="topbar">
      <div id="topbar-main"></div>
      <button id="sync" class="sync" data-act="sync" hidden></button>
    </header>

    <main id="view"></main>

    <nav class="tabbar">
      <button class="tab" data-act="tab" data-tab="home">
        <svg viewBox="0 0 24 24"><path d="M4 10.2 12 4l8 6.2V19a1 1 0 0 1-1 1h-4.5v-5.5h-5V20H5a1 1 0 0 1-1-1z"/></svg><span>홈</span>
      </button>
      <button class="tab" data-act="tab" data-tab="list">
        <svg viewBox="0 0 24 24"><path d="M5 5.5h14M5 12h14M5 18.5h9"/></svg><span>내역</span>
      </button>
      <button class="tab add" data-act="new-entry" aria-label="기록하기">
        <span class="add-btn"><svg viewBox="0 0 24 24"><path d="M12 6v12M6 12h12"/></svg></span>
      </button>
      <button class="tab" data-act="tab" data-tab="stats">
        <svg viewBox="0 0 24 24"><path d="M5 19.5V13M12 19.5V5M19 19.5V9.5"/></svg><span>통계</span>
      </button>
      <button class="tab" data-act="tab" data-tab="settings">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="1.2"/><circle cx="5.5" cy="12" r="1.2"/><circle cx="18.5" cy="12" r="1.2"/></svg><span>설정</span>
      </button>
    </nav>
  </div>

  <div id="sheet-root"></div>
  <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
